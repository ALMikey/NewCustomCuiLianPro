# ===== 4.4.31 新增淬炼石 =====
# Chance 的键为正常成功目标星级，不是当前星级；数值为百分比。
# bonusRiseChance 为成功后额外升星的概率，不会提高基础成功率。
# targetLevel > 0 表示直升绝对星级；当前星级不低于目标时不消耗。
# 所有石头受 config.yml 的 MaxRefineLevel 限制；额外升星到上限封顶。
xuhe:
    Name: "§6§l虚核淬炼石"
    Type: COAL
    Data: 0
    riseLevel: 1
    bonusRiseLevel: 1
    bonusRiseChance: 50
    dropLevel: "0 3"
    Lore:
      - "§e用法：§a当作燃料放进熔炉"
      - "§7活动淬炼石，成功率与高等淬炼宝石一致"
      - "§a成功随机升1或2星（各50%，最高18星）"
      - "§c失败随机掉0-3星，已淬炼装备最低保留1星"
    Chance:
        1: 100
        2: 100
        3: 100
        4: 90
        5: 80
        6: 70
        7: 60
        8: 50
        9: 40
        10: 33
        11: 27
        12: 20
        13: 15
        14: 10
        15: 10
        16: 8
        17: 6
        18: 4
