# 内置属性系统配置
# enabled: true 开启 / false 关闭
enabled: true
# debug: true 时，每次命中会在控制台输出属性结算信息；正式服建议保持 false。
debug: false
# 暴击倍率。2.0 表示暴击时，原版/Mod 武器伤害与物理伤害词条之和乘以 2。
critical:
  multiplier: 2.0
# keyword 为 lore 中数值前的完整文本。颜色代码会被自动忽略。
# 支持整数和小数，例如 "物理伤害: 10"、"物理伤害: 10.5"。
# CRITICAL_CHANCE 的数值按百分比计算，例如 "暴击概率: 15" 表示 15%。
attributes:
  物理伤害:
    keyword: "物理伤害:"
    type: ATTACK
  物理防御:
    keyword: "物理防御:"
    type: DEFENSE
  暴击概率:
    keyword: "暴击概率:"
    type: CRITICAL_CHANCE
