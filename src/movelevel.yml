# /cuilian moveLevel 打开。原装备不放入界面，左键背包选择A、B，再点确认。
enabled: true
# 每次成功移星扣除PlayerPoints点券；0为免费。缺少PlayerPoints时收费移星不可用。
cost: 100
# 默认同分类：武器->武器、头盔->头盔等；关闭后仍检查宝石是否允许镶嵌到目标。
